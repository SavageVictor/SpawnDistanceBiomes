plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

repositories {
    maven { url 'https://maven.isxander.dev/releases' }
    maven { url 'https://api.modrinth.com/maven' }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
        // Forward any -Psdb.* gradle property to the game JVM.
        // Controls the headless scanner (sdb.scan, sdb.scan.radius, sdb.scan.step,
        // sdb.scan.heightStep) and the climate knobs (sdb.oceanOffset, sdb.temperatureOffset,
        // sdb.vegetationOffset, sdb.verticalScale, sdb.flatTerrainSkew, sdb.biomeSwap, ...).
        // Example: ./gradlew runServer -Psdb.scan=true -Psdb.temperatureOffset=0.8
        gradle.startParameter.projectProperties.each { k, v ->
            if (k.startsWith('sdb.')) systemProperty k, v
        }
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Tectonic (compile-only) — we mixin into its density functions to make
    // ocean_offset / continent scale distance-aware. Not bundled; optional at runtime.
    compileOnly files("libs/tectonic-3.0.26-neoforge-21.1.jar")

    // Dev-runtime only: load Tectonic + its deps for local runServer/runClient testing.
    // Not shipped — real users install Tectonic themselves.
    localRuntime files("libs/tectonic-3.0.26-neoforge-21.1.jar")
    localRuntime "maven.modrinth:apollib:1.1.5-neoforge-21.1"
    localRuntime "maven.modrinth:lithostitched:1.7.13-neoforge-21.1"

    // YACL - Yet Another Config Library (Structurify's UI framework)
    // Bundled into our JAR via jarJar — users don't need to install it separately
    implementation "dev.isxander:yet-another-config-lib:${yacl_version}"
    jarJar(group: 'dev.isxander', name: 'yet-another-config-lib', version: '3.8.2+1.21.1-neoforge')
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
